[package]
name = "quid-reputation"

version = "0.1.0"

edition = "2021"
publish = false

[lib]

# "lib" as well as "cdylib" so sibling contracts (and their tests) can depend on
# this crate the way they already depend on quid-fee-collector / quid-staking.
crate-type = ["lib", "cdylib"]


[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }


[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true

